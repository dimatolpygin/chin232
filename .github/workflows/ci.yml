name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Линт
        run: ruff check app tests migrations

      - name: Формат
        run: ruff format --check app tests

      - name: Тесты
        env:
          BOT_TOKEN: "123:AAtest"
          DATABASE_URL: "postgresql+asyncpg://u:p@localhost/db"
          REDIS_URL: "redis://localhost:6379/5"
        run: pytest -q

      - name: Сборка образа
        run: docker build -f docker/Dockerfile -t china_bot:ci .

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка, что ключи не попали в репозиторий
        run: |
          if git grep -nE "sk-or-v1-[A-Za-z0-9]|sk-proj-[A-Za-z0-9]|sk-fish-[A-Za-z0-9]|[0-9]{8,}:AA[A-Za-z0-9_-]{20,}" -- . ':!.github/workflows/ci.yml' ':!tests'; then
            echo "НАЙДЕН КЛЮЧ В РЕПОЗИТОРИИ — коммит недопустим" >&2
            exit 1
          fi
          echo "чисто"

  deploy:
    # Катим только с main и только после зелёных тестов: сервер боевой, там
    # живой бот и деньги. Ручной запуск оставлен на случай отката.
    needs: [lint-and-test, secrets-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Две выкатки одновременно перетрут друг друга на середине сборки образа.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Ключ доступа и отпечаток сервера
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Отпечаток задан заранее: без него ssh либо спросит подтверждение,
          # либо примет любой сервер, который ответит по этому адресу.
          echo "${{ secrets.SERVER_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Выкатка на сервер
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'set -e
             cd /opt/china_bot
             git fetch --quiet origin main
             git reset --hard origin/main
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
             docker image prune -f'

      - name: Проверка живости
        run: |
          # Имена переменных строго латиницей: bash кириллические идентификаторы
          # не принимает и падает с "not a valid identifier".
          for attempt in $(seq 1 15); do
            answer=$(curl -sf --max-time 10 https://chinesetonebot.ru/health || true)
            case "$answer" in
              *'"status":"ok"'*)
                echo "сервер отвечает: $answer"
                exit 0
                ;;
            esac
            echo "попытка $attempt: сервер ещё не поднялся"
            sleep 10
          done
          echo "после выкатки /health так и не ответил" >&2
          exit 1
