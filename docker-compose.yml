# Dev-режим. postgres16 и redis уже подняты на машине разработки и общие
# с чужими проектами, поэтому здесь их нет: ходим на host.docker.internal
# по опубликованным портам. Своя база и свой пользователь china_bot обязательны,
# префикс ключей redis — china:.
#
# Боевой режим: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Образ собирает только сервис bot. Если дать build всем трём, они одновременно
# экспортируют один и тот же тег и сборка падает с "image already exists".

x-app: &app
  image: china_bot:dev
  env_file: .env
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    # Код примонтирован: правка .py перезапускает процесс через watchfiles,
    # пересборка образа нужна только при смене зависимостей.
    - ./app:/app/app
    - ./migrations:/app/migrations
    - ./alembic.ini:/app/alembic.ini
    - ./tests:/app/tests

services:
  bot:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: china_bot
    command: ["bot"]

  worker:
    <<: *app
    container_name: china_worker
    command: ["worker"]
    depends_on:
      bot:
        condition: service_started

  api:
    <<: *app
    container_name: china_api
    command: ["api"]
    ports:
      - "8090:8080"
    depends_on:
      bot:
        condition: service_started
