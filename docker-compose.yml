# Базовый compose, общий для разработки и боевого сервера. Здесь НЕТ монтирования
# кода: dev-специфика вынесена в docker-compose.override.yml, который compose
# подхватывает сам при локальном `docker compose up`. Прод собирается явно:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# и override в этой команде не участвует. Раньше dev-монтирования жили здесь, а
# прод-оверрайд глушил их пустым `volumes: []` — не работает: пустой список
# ничего не отменяет, и на сервер уезжал код с хоста вместе с файлом запуска без
# бита запуска, отчего контейнеры падали в цикле.
#
# postgres16 и redis на машине разработки уже подняты и общие с чужими проектами,
# поэтому здесь их нет: ходим на host.docker.internal по опубликованным портам.
# Своя база и свой пользователь china_bot обязательны, префикс ключей redis —
# china:. На сервере база и redis свои, их добавляет docker-compose.prod.yml.
#
# Образ собирает только сервис bot. Если дать build всем трём, они одновременно
# экспортируют один и тот же тег и сборка падает с "image already exists".

x-app: &app
  image: china_bot:dev
  env_file: .env
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  bot:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: china_bot
    command: ["bot"]

  worker:
    <<: *app
    container_name: china_worker
    command: ["worker"]
    depends_on:
      bot:
        condition: service_started

  api:
    <<: *app
    container_name: china_api
    command: ["api"]
    ports:
      - "8090:8080"
    depends_on:
      bot:
        condition: service_started
